<title>Ono Mar · Dashboard Financeiro</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--wine:#6B1524;--wine-d:#3D0A12;--gold:#C08B3E;--gold-l:#E0BE84;--ink:#1B1517;--muted:#8A7F83;--line:#EBE4E5;--neg:#B3261E}
body{font-family:'Century Gothic','Inter','Segoe UI',-apple-system,Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;
  background:linear-gradient(135deg,#2E070E 0%,#54101C 55%,#6B1524 100%);color:var(--ink)}
.box{width:100%;max-width:380px;background:#fff;border-radius:18px;box-shadow:0 30px 80px rgba(20,4,8,.45);overflow:hidden}
.hd{padding:30px 32px 22px;text-align:center;border-bottom:1px solid var(--line)}
.logo{width:92px;height:92px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 14px;box-shadow:0 4px 14px rgba(61,10,18,.18)}
.mk{width:52px;height:52px;border-radius:14px;border:1.6px solid var(--gold);display:grid;place-items:center;margin:0 auto 14px;color:var(--wine);font-weight:800;letter-spacing:.04em}
.hd h1{font-size:19px;font-weight:700;color:var(--wine-d);letter-spacing:.12em}
.hd p{font-size:12px;color:var(--muted);margin-top:6px}
form{padding:24px 32px 30px}
label{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
input{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;font:inherit;font-size:14px;outline:none;margin-bottom:16px;transition:.15s}
input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(192,139,62,.18)}
button{width:100%;padding:12px;border:0;border-radius:10px;background:linear-gradient(135deg,var(--wine-d),var(--wine));color:#fff;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{display:none;font-size:12px;color:var(--neg);background:#FBECEB;border-radius:8px;padding:9px 11px;margin-bottom:14px}
.err.on{display:block}
.ft{text-align:center;font-size:10.5px;color:var(--muted);padding:0 32px 22px}
</style>
</head>

const u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function abrir(user, pwd){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(user.trim().toLowerCase()+':'+pwd), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:u8(D.s), iterations:D.n, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:u8(D.i)}, key, u8(D.c));
  return new TextDecoder().decode(pt);
}
document.getElementById('f').addEventListener('submit', async ev => {
  ev.preventDefault();
  const b = document.getElementById('b'), e = document.getElementById('e');
  b.disabled = true; b.textContent = 'Verificando…'; e.classList.remove('on');
  try{
    const html = await abrir(document.getElementById('u').value, document.getElementById('p').value);
    document.open(); document.write(html); document.close();
  }catch(_){
    e.classList.add('on'); b.disabled = false; b.textContent = 'Entrar';
  }
});
